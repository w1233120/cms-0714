<p-toast />

<div class="form-header">
  <h2>{{ isEdit ? '編輯合作廠商' : '新增合作廠商' }}</h2>
  <div class="form-header__actions">
    <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
    <p-button label="儲存" icon="pi pi-check" (onClick)="save()" />
  </div>
</div>

<form [formGroup]="form">
  <div class="form-card">
    <h3>合作廠商資料</h3>

    @if (isEdit) {
      <div class="field field--readonly">
        <label>主代碼</label>
        <div class="value">{{ pkid }}</div>
      </div>
    }

    <div class="field">
      <label for="name">廠商名稱 <span class="required">*</span></label>
      <input pInputText id="name" formControlName="name" maxlength="50" />
    </div>

    <div class="field">
      <label for="appKey">關鍵字 <span class="required">*</span></label>
      <input pInputText id="appKey" formControlName="appKey" maxlength="10" />
    </div>

    <div class="field">
      <label for="nameOnPartnerMenu">選單顯示名稱 <span class="required">*</span></label>
      <input pInputText id="nameOnPartnerMenu" formControlName="nameOnPartnerMenu" maxlength="200" />
    </div>

    <div class="field">
      <label for="nameOnCourseDetailPage">課程詳細頁顯示名稱 <span class="required">*</span></label>
      <input
        pInputText
        id="nameOnCourseDetailPage"
        formControlName="nameOnCourseDetailPage"
        maxlength="50"
      />
    </div>

    <div class="field">
      <label for="displayOrder">顯示順序 <span class="required">*</span></label>
      <p-inputNumber inputId="displayOrder" formControlName="displayOrder" [useGrouping]="false" />
    </div>

    <div class="field">
      <label for="imageFilename">圖片檔名</label>
      <input pInputText id="imageFilename" formControlName="imageFilename" maxlength="50" />
    </div>
  </div>
</form>
