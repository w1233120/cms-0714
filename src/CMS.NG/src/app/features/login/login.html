<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-card__brand">
      <i class="pi pi-th-large"></i>
      <span>CMS</span>
    </div>
    <h2>登入 Sign in</h2>

    <div class="field">
      <label for="userId">帳號 UserId</label>
      <input pInputText id="userId" formControlName="userId" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">密碼 Password</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="login-card__password"
      />
    </div>

    @if (errorMessage()) {
      <p class="login-card__error">{{ errorMessage() }}</p>
    }

    <p-button
      type="submit"
      label="登入"
      icon="pi pi-sign-in"
      [loading]="submitting()"
      styleClass="login-card__submit"
    />
  </form>
</div>
