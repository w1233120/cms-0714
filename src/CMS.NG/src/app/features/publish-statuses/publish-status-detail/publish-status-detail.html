@if (status) {
  <div class="form-header">
    <h2>檢視發布狀態</h2>
    <div class="form-header__actions">
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    </div>
  </div>

  <div class="form-card">
    <h3>發布狀態資料</h3>

    <div class="field">
      <label>主代碼</label>
      <div class="value">{{ status.pkid }}</div>
    </div>

    <div class="field">
      <label>狀態說明</label>
      <div class="value">{{ status.description }}</div>
    </div>

    <div class="field">
      <label>草稿</label>
      <div class="value">{{ status.isDraft ? '是' : '否' }}</div>
    </div>

    <div class="field">
      <label>已發布</label>
      <div class="value">{{ status.isPublished ? '是' : '否' }}</div>
    </div>

    <div class="field">
      <label>已下架</label>
      <div class="value">{{ status.isDiscontinued ? '是' : '否' }}</div>
    </div>
  </div>
}
