<p-toast />
<p-confirmDialog />

<div class="list-header">
  <div class="list-header__title">
    <h2>發布狀態 PublishStatus</h2>
    <span class="subtitle">內容發布狀態代碼表</span>
  </div>
  <div class="list-header__actions">
    <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="filterVisible = true" />
    <p-button label="新增" icon="pi pi-plus" (onClick)="addNew()" />
  </div>
</div>

<p-table
  [value]="statuses"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [rowsPerPageOptions]="[10, 20, 50]"
  [sortField]="sortField"
  [sortOrder]="sortOrder"
  (onSort)="onSort($event)"
  (onPage)="onPage($event)"
  dataKey="pkid"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="pkid">主代碼 <p-sortIcon field="pkid" /></th>
      <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
      <th pSortableColumn="isDraft">草稿 <p-sortIcon field="isDraft" /></th>
      <th pSortableColumn="isPublished">已發布 <p-sortIcon field="isPublished" /></th>
      <th pSortableColumn="isDiscontinued">已下架 <p-sortIcon field="isDiscontinued" /></th>
      <th>操作</th>
    </tr>
  </ng-template>
  <ng-template #body let-status>
    <tr>
      <td>{{ status.pkid }}</td>
      <td>{{ status.description }}</td>
      <td class="flag">
        <i class="pi" [class.pi-check]="status.isDraft" [class.pi-minus]="!status.isDraft"></i>
      </td>
      <td class="flag">
        <i class="pi" [class.pi-check]="status.isPublished" [class.pi-minus]="!status.isPublished"></i>
      </td>
      <td class="flag">
        <i class="pi" [class.pi-check]="status.isDiscontinued" [class.pi-minus]="!status.isDiscontinued"></i>
      </td>
      <td class="actions">
        <p-button icon="pi pi-eye" severity="secondary" [text]="true" (onClick)="view(status)" />
        <p-button icon="pi pi-pencil" severity="info" [text]="true" (onClick)="edit(status)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="remove(status)" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6">查無資料</td>
    </tr>
  </ng-template>
</p-table>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right">
  <form [formGroup]="filterForm" class="filter-form" (ngSubmit)="search()">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input pInputText id="keyword" formControlName="keyword" placeholder="狀態說明" />
    </div>
    <div class="field">
      <label for="isDraft">草稿</label>
      <p-select
        inputId="isDraft"
        formControlName="isDraft"
        [options]="flagOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isPublished">已發布</label>
      <p-select
        inputId="isPublished"
        formControlName="isPublished"
        [options]="flagOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isDiscontinued">已下架</label>
      <p-select
        inputId="isDiscontinued"
        formControlName="isDiscontinued"
        [options]="flagOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="filter-form__actions">
      <p-button label="重設" severity="secondary" type="button" (onClick)="resetFilters()" />
      <p-button label="搜尋" type="submit" />
    </div>
  </form>
</p-drawer>
