<p-toast />

<div class="form-header">
  <h2>{{ isEdit ? '編輯角色' : '新增角色' }}</h2>
  <div class="form-header__actions">
    <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
    <p-button label="儲存" icon="pi pi-check" (onClick)="save()" />
  </div>
</div>

<form [formGroup]="form">
  <div class="form-card">
    <h3>角色資料</h3>

    <div class="field">
      <label for="roleId">角色代碼 <span class="required">*</span></label>
      <input pInputText id="roleId" formControlName="roleId" placeholder="請輸入角色代碼" />
    </div>

    <div class="field">
      <label for="roleName">角色名稱 <span class="required">*</span></label>
      <input pInputText id="roleName" formControlName="roleName" />
    </div>

    <div class="field">
      <label for="permissionLevel">權限等級 <span class="required">*</span></label>
      <p-inputNumber inputId="permissionLevel" formControlName="permissionLevel" [useGrouping]="false" />
    </div>

    <div class="field">
      <label for="description">描述 <span class="required">*</span></label>
      <input pInputText id="description" formControlName="description" />
    </div>
  </div>

  <div class="form-card">
    <h3>使用者</h3>
    <p-multiSelect
      formControlName="userIds"
      [options]="userOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="選擇使用者（可複選）"
      appendTo="body"
      [filter]="true"
      [maxSelectedLabels]="9999"
    />
  </div>
</form>
