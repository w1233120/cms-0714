<p-toast />
<p-confirmDialog />

<div class="list-header">
  <div class="list-header__title">
    <h2>角色 AppRole</h2>
    <span class="subtitle">使用者角色</span>
  </div>
  <div class="list-header__actions">
    <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="filterVisible = true" />
    <p-button label="新增" icon="pi pi-plus" (onClick)="addNew()" />
  </div>
</div>

<p-table
  [value]="roles"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [rowsPerPageOptions]="[10, 20, 50]"
  [sortField]="sortField"
  [sortOrder]="sortOrder"
  (onSort)="onSort($event)"
  (onPage)="onPage($event)"
  dataKey="roleId"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="pkid">主代碼 <p-sortIcon field="pkid" /></th>
      <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
      <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
      <th pSortableColumn="permissionLevel">權限等級 <p-sortIcon field="permissionLevel" /></th>
      <th>描述</th>
      <th pSortableColumn="userCount">使用者數 <p-sortIcon field="userCount" /></th>
      <th>操作</th>
    </tr>
  </ng-template>
  <ng-template #body let-role>
    <tr>
      <td>{{ role.pkid }}</td>
      <td>{{ role.roleId }}</td>
      <td>{{ role.roleName }}</td>
      <td>{{ role.permissionLevel }}</td>
      <td>{{ role.description }}</td>
      <td>{{ role.userCount }}</td>
      <td class="actions">
        <p-button icon="pi pi-eye" severity="secondary" [text]="true" (onClick)="view(role)" />
        <p-button icon="pi pi-pencil" severity="info" [text]="true" (onClick)="edit(role)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="remove(role)" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7">查無資料</td>
    </tr>
  </ng-template>
</p-table>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right">
  <form [formGroup]="filterForm" class="filter-form" (ngSubmit)="search()">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input pInputText id="keyword" formControlName="keyword" placeholder="角色代碼／角色名稱／描述" />
    </div>
    <div class="field">
      <label for="permissionLevel">權限等級</label>
      <p-inputNumber inputId="permissionLevel" formControlName="permissionLevel" [useGrouping]="false" />
    </div>
    <div class="filter-form__actions">
      <p-button label="重設" severity="secondary" type="button" (onClick)="resetFilters()" />
      <p-button label="搜尋" type="submit" />
    </div>
  </form>
</p-drawer>
