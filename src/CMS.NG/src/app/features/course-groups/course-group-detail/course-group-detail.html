@if (courseGroup) {
  <div class="form-header">
    <h2>檢視課程群組</h2>
    <div class="form-header__actions">
      <app-row-audit-badge tableName="CourseGroup" [pkid]="courseGroup.pkid" />
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    </div>
  </div>

  <div class="form-card">
    <h3>課程群組資料</h3>

    <div class="field">
      <label>主代碼</label>
      <div class="value">{{ courseGroup.pkid }}</div>
    </div>

    <div class="field">
      <label>群組名稱</label>
      <div class="value">{{ courseGroup.description }}</div>
    </div>
  </div>
}
