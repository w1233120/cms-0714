<p-toast />

<div class="form-header">
  <h2>{{ isEdit ? '編輯課程群組' : '新增課程群組' }}</h2>
  <div class="form-header__actions">
    <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
    <p-button label="儲存" icon="pi pi-check" (onClick)="save()" />
  </div>
</div>

<form [formGroup]="form">
  <div class="form-card">
    <h3>課程群組資料</h3>

    @if (isEdit) {
      <div class="field field--readonly">
        <label>主代碼</label>
        <div class="value">{{ pkid }}</div>
      </div>
    }

    <div class="field">
      <label for="description">群組名稱 <span class="required">*</span></label>
      <input pInputText id="description" formControlName="description" maxlength="100" />
    </div>
  </div>
</form>
